[project]
name = "nethop"
version = "0.2.0"
description = "btop-inspired TUI to explore your LAN with nmap"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "nethop contributors" },
]
keywords = ["nmap", "tui", "network", "lan", "textual", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
dependencies = [
    "textual>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/um1chc5/aner-toolkits"
Repository = "https://github.com/um1chc5/aner-toolkits"
Issues = "https://github.com/um1chc5/aner-toolkits/issues"

[project.scripts]
nethop = "nethop.app:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nethop*"]

[tool.setuptools.package-data]
nethop = ["*.tcss"]

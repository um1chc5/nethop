[project]
name = "aner-games"
version = "0.3.0"
description = "Terminal game launcher — pick a title and play"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "aner-toolkits contributors" },
]
keywords = ["tui", "games", "snake", "tetris", "2048", "terminal", "textual"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "textual>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/um1chc5/aner-toolkits"
Repository = "https://github.com/um1chc5/aner-toolkits"
Issues = "https://github.com/um1chc5/aner-toolkits/issues"

[project.scripts]
aner-games = "aner_games.app:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aner_games*"]

[tool.setuptools.package-data]
aner_games = ["*.tcss"]
